"$schema" = 'https://starship.rs/config-schema.json'

# =========================================================================== #
# PROFILE
# Reference: https://starship.rs/config/
# =========================================================================== #

palette = "Twilite"

right_format = "[$time]($style) [$jobs]($style) [$battery]($style)"

format = """\
$localip\
$docker_context\
$kubernetes\
$direnv\
$shell\
$line_break\
$all\
$line_break\
$character \
"""

add_newline = true
follow_symlinks = false
scan_timeout = 50
command_timeout = 500

[line_break]
disabled = false

[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[✗](bold red)"

[cmd_duration]
style = "bold yellow"

[username]
format = "[$user]($style) "
style_user = "bold cyan"

[hostname]
style = "bold purple"

[directory]
read_only = " 󰌾 "
style = "bold green"

# =========================================================================== #
# system
# =========================================================================== #

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "💀 "

[container]
format = '[$symbol \[$name\]]($style) '
symbol = " ⬢ "
style = "bold red"

[docker_context]
symbol = "  "
style = "bold green"
only_with_files = false

[fill]
symbol = " . "
style = "bold black"

[jobs]
symbol = " ✦ "
number_threshold = 4
symbol_threshold = 0
style = "bold blue"

[memory_usage]
symbol = " 󰍛 "
style = "bold red"

[status]
symbol = "  "
style = "bold red"

[time]
format = "🕙[ $time ]($style) "
time_format = "%T"
style = "bold dimmed white"

[shell]
powershell_indicator = "psh"
pwsh_indicator = "pwsh"
bash_indicator = "bash"
zsh_indicator = "zsh"
format = "[$indicator]($style) "
style = "cyan bold"
disabled = false

# =========================================================================== #
# scm
# =========================================================================== #

[git_branch]
symbol = "  "
style = "bold pink"

[git_commit]
tag_symbol = "  "
style = "bold pink"

[git_metrics]
added_style = "bold green"
deleted_style = "bold red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
disabled = true

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bold yellow"

[git_status]
style = "bold red"

# =========================================================================== #
# platform
# =========================================================================== #

[aws]
symbol = "  "
style = "bold purple"
format = "[$symbol ]($style)"

[gcloud]
symbol = "  "
style = "bold purple"

[kubernetes]
disabled = false
symbol = " ⎈ "
style = "bold brightPurple"
format = '[$symbol$context(\($namespace\))]($style) '
contexts = [
	{ context_pattern = ".*(dev|test).*", style = "bold brightGreen", symbol = "⚙️" },
	{ context_pattern = ".*staging.*", style = "bold brightYellow", symbol = " 🟡 " },
	{ context_pattern = ".*prod.*", style = "bold brightRed", symbol = " 🔥 " }
]

[localip]
disabled = false
ssh_only = false
format = '📡 [$localipv4]($style) '
style = "bold brightYellow"

[direnv]
disabled = false
symbol = " 🌿 "
style = "bold green"
format = '[$symbol$loaded]($style) '

# =========================================================================== #
# version management
# =========================================================================== #

[conda]
symbol = " ◉ "
style = "bold yellow"
ignore_base = false
format = "[$symbol$environment ]($style)"


[nix_shell]
symbol = "  "
style = "bold green"

