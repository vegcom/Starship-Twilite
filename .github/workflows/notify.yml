name: Notify on changes

on:
  push:
    branches: [main]
    paths:
      - starship.toml

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository dispatch
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
        run: |
          gh api \
            --method POST \
            /repos/$TARGET_REPO/dispatches \
            -f "event_type=update"
